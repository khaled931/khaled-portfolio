<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile viewport review — Experience Gallery</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #dfe8e5;
        font: 14px system-ui;
        color: #193b40;
      }
      header {
        display: flex;
        gap: 20px;
        align-items: center;
        margin: 0 0 20px;
      }
      button,
      select {
        font: inherit;
        min-height: 44px;
        padding: 8px 14px;
        border: 1px solid #aabebb;
        border-radius: 8px;
        background: #fff;
      }
      iframe {
        display: block;
        border: 0;
        background: #f8faf7;
        box-shadow: 0 12px 40px #193b4033;
        max-width: 100%;
      }
      p {
        max-width: 650px;
        line-height: 1.6;
      }
      #viewport {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Responsive viewport review</strong
      ><label
        >Width
        <select id="width">
          <option value="390">390px</option>
          <option value="320">320px</option>
          <option value="430">430px</option>
          <option value="768">768px</option>
          <option value="1024">1024px</option>
        </select></label
      ><label
        >Height
        <select id="height">
          <option value="844">844px</option>
          <option value="667">667px</option>
          <option value="932">932px</option>
        </select></label
      >
    </header>
    <div id="viewport">
      <iframe
        name="mobile-preview"
        title="Portfolio at the selected viewport"
        src="/#experience"
        width="390"
        height="844"
      ></iframe>
    </div>
    <p>
      This development-only page renders the real application in an iframe at
      the selected CSS viewport. It checks responsive layout, readable content
      and navigation. It does not emulate a physical device or operating-system
      safe areas.
    </p>
    <script>
      const frame = document.querySelector("iframe");
      document
        .querySelector("#width")
        .addEventListener(
          "change",
          (event) => (frame.width = event.target.value),
        );
      document
        .querySelector("#height")
        .addEventListener(
          "change",
          (event) => (frame.height = event.target.value),
        );
    </script>
  </body>
</html>
